name: Track am-dependency dist-tags

on:
  # schedule:
    # - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: dev
            tag: dev
          - branch: staging
            tag: staging
          - branch: master
            tag: prod
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: "@washogren"

      - name: Resolve dist-tag and update package.json
        id: bump
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ }}
        run: |
          PACKAGE="@washogren/am-dependency"
          CURRENT=$(node -p "require('./package.json').dependencies['${PACKAGE}']")
          LATEST=$(npm dist-tag ls "${PACKAGE}" | awk -F': ' -v tag="${{ matrix.tag }}" '$1 == tag {print $2}')

          if [ -z "$LATEST" ]; then
            echo "Tag '${{ matrix.tag }}' not found on ${PACKAGE}. Skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$CURRENT" = "$LATEST" ]; then
            echo "Already at ${LATEST}. Nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          npm install --save-exact "${PACKAGE}@${LATEST}"
          echo "changed=true"  >> "$GITHUB_OUTPUT"
          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "latest=${LATEST}"   >> "$GITHUB_OUTPUT"

      - name: Build PR body with changelog
        if: steps.bump.outputs.changed == 'true'
        id: body
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ }}
          GH_TOKEN: ${{ secrets.GH_PACKAGES_READ }}
        run: |
          set -euo pipefail
          PACKAGE="@washogren/am-dependency"
          PREV="${{ steps.bump.outputs.current }}"
          NEXT="${{ steps.bump.outputs.latest }}"
          BODY="${RUNNER_TEMP}/pr-body.md"

          {
            echo "Automated dist-tag tracking update."
            echo ""
            echo "Package:    \`${PACKAGE}\`"
            echo "Tag:        \`${{ matrix.tag }}\`"
            echo "Previous:   \`${PREV}\`"
            echo "New:        \`${NEXT}\`"
            echo ""
          } > "${BODY}"

          # Pin to NEXT (just-published, guaranteed to exist) to read repository.url.
          # The unpinned form returns empty against GitHub Packages.
          REPO_URL_RAW=$(npm view "${PACKAGE}@${NEXT}" repository.url 2>/dev/null || echo "")
          REPO_URL=$(echo "${REPO_URL_RAW}" | sed -E 's#^git\+##; s#\.git$##; s#^git://#https://#')
          PREV_SHA=$(npm view "${PACKAGE}@${PREV}" gitHead 2>/dev/null || echo "")
          NEXT_SHA=$(npm view "${PACKAGE}@${NEXT}" gitHead 2>/dev/null || echo "")
          SLUG=$(echo "${REPO_URL}" | sed -nE 's#^https?://github.com/([^/]+/[^/]+).*$#\1#p')

          if [ -z "${PREV_SHA}" ] || [ -z "${NEXT_SHA}" ] || [ -z "${SLUG}" ]; then
            echo "_Could not resolve dependency repo or gitHead for both versions; changelog unavailable._" >> "${BODY}"
            echo "(repo=\`${REPO_URL}\`, prev_sha=\`${PREV_SHA}\`, next_sha=\`${NEXT_SHA}\`)" >> "${BODY}"
            echo "body-path=${BODY}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COMPARE_URL="${REPO_URL}/compare/${PREV_SHA}...${NEXT_SHA}"
          COMMITS_FILE="${RUNNER_TEMP}/commits.json"
          # Reverse so newest commits come first (compare API returns oldest-first).
          if ! gh api "repos/${SLUG}/compare/${PREV_SHA}...${NEXT_SHA}" --jq '.commits | reverse' > "${COMMITS_FILE}" 2>/dev/null; then
            echo "## Changes in \`${PACKAGE}\`" >> "${BODY}"
            echo "" >> "${BODY}"
            echo "Compare: [${PREV_SHA:0:7}...${NEXT_SHA:0:7}](${COMPARE_URL})" >> "${BODY}"
            echo "" >> "${BODY}"
            echo "_Could not fetch commit list (token may lack repo read for \`${SLUG}\`)._" >> "${BODY}"
            echo "body-path=${BODY}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COMMIT_COUNT=$(jq 'length' "${COMMITS_FILE}")
          {
            echo "## Changes in \`${PACKAGE}\`"
            echo ""
            echo "Compare: [\`${PREV_SHA:0:7}...${NEXT_SHA:0:7}\`](${COMPARE_URL}) — ${COMMIT_COUNT} commit(s)"
            echo ""
          } >> "${BODY}"

          # Annotate each commit with its associated PRs (if any), into a JSONL file.
          ENRICHED="${RUNNER_TEMP}/commits-with-prs.jsonl"
          : > "${ENRICHED}"
          while IFS= read -r commit; do
            SHA=$(jq -r '.sha' <<<"${commit}")
            PRS=$(gh api "repos/${SLUG}/commits/${SHA}/pulls" 2>/dev/null || echo "[]")
            jq --argjson prs "${PRS}" '. + {prs: $prs}' <<<"${commit}" | jq -c '.' >> "${ENRICHED}"
          done < <(jq -c '.[]' "${COMMITS_FILE}")

          # Group commits by PR; collect PR-less commits separately. Preserve order of first appearance.
          PR_ORDER=()
          declare -A PR_JSON
          declare -A PR_COMMITS
          STANDALONE=()

          while IFS= read -r entry; do
            SHA=$(jq -r '.sha' <<<"${entry}")
            SHORT=${SHA:0:7}
            SUBJECT=$(jq -r '.commit.message' <<<"${entry}" | head -n1)
            COMMIT_LINK="[\`${SHORT}\`](${REPO_URL}/commit/${SHA}) — ${SUBJECT}"
            PR_COUNT=$(jq '.prs | length' <<<"${entry}")
            if [ "${PR_COUNT}" -eq 0 ]; then
              STANDALONE+=("${SHA}")
            else
              while IFS= read -r pr; do
                NUM=$(jq -r '.number' <<<"${pr}")
                if [ -z "${PR_JSON[${NUM}]:-}" ]; then
                  PR_JSON[${NUM}]="${pr}"
                  PR_COMMITS[${NUM}]=""
                  PR_ORDER+=("${NUM}")
                fi
                PR_COMMITS[${NUM}]="${PR_COMMITS[${NUM}]}- ${COMMIT_LINK}"$'\n'
              done < <(jq -c '.prs[]' <<<"${entry}")
            fi
          done < "${ENRICHED}"

          for NUM in "${PR_ORDER[@]}"; do
            pr="${PR_JSON[${NUM}]}"
            TITLE=$(jq -r '.title' <<<"${pr}")
            URL=$(jq -r '.html_url' <<<"${pr}")
            PR_BODY=$(jq -r '.body // ""' <<<"${pr}")
            {
              echo ""
              echo "### [#${NUM}](${URL}) — ${TITLE}"
              echo ""
              echo "<details>"
              echo "<summary>Commits and description</summary>"
              echo ""
              echo "**Commits:**"
              echo ""
              printf '%s' "${PR_COMMITS[${NUM}]}"
              if [ -n "${PR_BODY}" ]; then
                echo ""
                echo "**Description:**"
                echo ""
                # Full PR body, no truncation. Indent inside <details> renders as-is on GitHub.
                echo "${PR_BODY}"
                echo ""
              fi
              echo "</details>"
            } >> "${BODY}"
          done

          if [ "${#STANDALONE[@]}" -gt 0 ]; then
            {
              echo ""
              echo "### Commits without an associated PR"
              echo ""
            } >> "${BODY}"
            for SHA in "${STANDALONE[@]}"; do
              entry=$(jq -c --arg sha "${SHA}" '.[] | select(.sha == $sha)' "${COMMITS_FILE}")
              SHORT=${SHA:0:7}
              MSG=$(jq -r '.commit.message' <<<"${entry}")
              SUBJECT=$(echo "${MSG}" | head -n1)
              REST=$(echo "${MSG}" | tail -n +3)
              {
                echo "#### [\`${SHORT}\`](${REPO_URL}/commit/${SHA}) — ${SUBJECT}"
                if [ -n "${REST}" ]; then
                  echo ""
                  echo "<details>"
                  echo "<summary>Description</summary>"
                  echo ""
                  echo "${REST}"
                  echo ""
                  echo "</details>"
                fi
                echo ""
              } >> "${BODY}"
            done
          fi

          echo "body-path=${BODY}" >> "$GITHUB_OUTPUT"

      - name: Open PR
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GH_PACKAGES_READ }}
          base: ${{ matrix.branch }}
          branch: auto-update/am-dependency-${{ matrix.tag }}
          delete-branch: true
          title: "Bump @washogren/am-dependency to ${{ steps.bump.outputs.latest }} (${{ matrix.tag }})"
          commit-message: "Track @washogren/am-dependency ${{ matrix.tag }} -> ${{ steps.bump.outputs.latest }}"
          body-path: ${{ steps.body.outputs.body-path }}
