name: Track am-dependency dist-tags

on:
  # schedule:
    # - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: dev
            tag: dev
          - branch: staging
            tag: staging
          - branch: master
            tag: prod
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: "@washogren"

      - name: Resolve dist-tag and update package.json
        id: bump
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ }}
        run: |
          PACKAGE="@washogren/am-dependency"
          CURRENT=$(node -p "require('./package.json').dependencies['${PACKAGE}']")
          LATEST=$(npm dist-tag ls "${PACKAGE}" | awk -F': ' -v tag="${{ matrix.tag }}" '$1 == tag {print $2}')

          if [ -z "$LATEST" ]; then
            echo "Tag '${{ matrix.tag }}' not found on ${PACKAGE}. Skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$CURRENT" = "$LATEST" ]; then
            echo "Already at ${LATEST}. Nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          npm install --save-exact "${PACKAGE}@${LATEST}"
          echo "changed=true"  >> "$GITHUB_OUTPUT"
          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "latest=${LATEST}"   >> "$GITHUB_OUTPUT"

      - name: Open PR
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          base: ${{ matrix.branch }}
          branch: auto-update/am-dependency-${{ matrix.tag }}
          delete-branch: true
          title: "Bump @washogren/am-dependency to ${{ steps.bump.outputs.latest }} (${{ matrix.tag }})"
          commit-message: "Track @washogren/am-dependency ${{ matrix.tag }} -> ${{ steps.bump.outputs.latest }}"
          body: |
            Automated dist-tag tracking update.

            Package:    `@washogren/am-dependency`
            Tag:        `${{ matrix.tag }}`
            Previous:   `${{ steps.bump.outputs.current }}`
            New:        `${{ steps.bump.outputs.latest }}`

            Resolved from `npm dist-tag ls @washogren/am-dependency`.
